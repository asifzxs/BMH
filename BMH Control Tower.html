<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>BMH Control Tower</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#240B17;--p:#361426;--p2:#471C33;--t:#FFF1DC;--m:#C9A9A6;--g:#FFB020;--r:#FF5D7A;--k:#8FE36A;--b:rgba(255,241,220,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(900px 500px at 85% -10%,#6b1f45 0,transparent 60%),var(--bg);color:var(--t);font:15px/1.5 'DM Sans',system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0}
header{padding:28px 28px 8px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.hero{font-size:clamp(40px,7vw,86px);font-weight:900;line-height:.95;letter-spacing:-2px;background:linear-gradient(100deg,#FFB020,#fff3c4 30%,#FF5D7A 55%,#FFB020 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
@keyframes sh{to{background-position:-250% 0}}
@media(prefers-reduced-motion:reduce){.hero{animation:none}}
.sub{color:var(--m);max-width:520px;margin-top:10px}
select,input,button{font:inherit;color:var(--t);background:var(--p2);border:1px solid var(--b);border-radius:10px;padding:8px 12px}
button{cursor:pointer;font-weight:700}button:hover{border-color:var(--g)}button.pri{background:var(--g);color:#2b1200;border:0}button.bad{background:var(--r);color:#2b0010;border:0}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--g)}
nav{display:flex;gap:6px;overflow-x:auto;padding:14px 28px;position:sticky;top:env(safe-area-inset-top,0px);background:rgba(36,11,23,.92);backdrop-filter:blur(8px);z-index:5}
nav button{white-space:nowrap;border-radius:99px}nav button.on{background:var(--g);color:#2b1200;border:0}
main{padding:8px 28px 60px;max-width:1280px;margin:auto}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--p);border:1px solid var(--b);border-radius:18px;padding:18px}
.big{font:900 34px Fraunces,serif;color:var(--g)}.lbl{color:var(--m);font-size:13px}
.up{color:var(--k)}.dn{color:var(--r)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--b);font-size:14px}th{color:var(--m);font-weight:500}
.wrap{overflow-x:auto}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--p2)}
.ok{background:#1f4a2a;color:var(--k)}.warn{background:#5a3a00;color:var(--g)}.crit{background:#5c1427;color:var(--r)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px}.bars div{flex:1;border-radius:8px 8px 0 0;background:linear-gradient(var(--g),var(--r));position:relative;min-height:6px;transition:height .5s}
.bars span{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:11px;color:var(--m)}
.best{outline:2px solid var(--k);outline-offset:-2px}
.chain{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.chain .n{background:var(--p2);border:1px solid var(--g);padding:10px 14px;border-radius:12px}.chain .n small{display:block;color:var(--m)}
h2{font-size:28px;margin:22px 0 4px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--g);color:#2b1200;padding:10px 18px;border-radius:12px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:9}
#toast.s{opacity:1}
</style></head><body>
<header><div><div class="hero">Bhaskar’s Money Holege</div><div class="sub">Control tower for procurement, production, stock, dispatch and franchise outlets. Every gram traced, every adjustment signed.</div></div>
<div class="row"><label class="lbl">Signed in as <select id="role"><option>Owner</option><option>Procurement</option><option>Quality</option><option>Franchise (Coimbatore RS Puram)</option></select></label></div></header>
<nav id="nav"></nav><main id="app"></main><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),R=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const V={SG:{n:'Sri Ganesh Agro',otd:94,rej:1.2},KD:{n:'Kovai Dairy Co-op',otd:91,rej:2.1},MS:{n:'Madurai Spice House',otd:88,rej:3.4},RN:{n:'Royal Nut Traders',otd:96,rej:.8},PW:{n:'PackWell Industries',otd:90,rej:1.9},SS:{n:'Sakthi Sugars',otd:87,rej:2.5},TD:{n:'TN Dairy Fresh',otd:93,rej:1.5},NN:{n:'Nilgiri Nuts',otd:89,rej:3.8},KP:{n:'Kaveri Packaging',otd:95,rej:1.1}};
const U={Besan:'kg',Sugar:'kg',Ghee:'kg',Cashew:'kg',Khoa:'kg',Cardamom:'kg',Pista:'kg','Gift box':'pcs'};
const O=[['Besan','SG',82,100,3],['Besan','MS',78,250,5],['Sugar','SS',41,500,4],['Sugar','SG',44,200,2],['Ghee','KD',560,50,2],['Ghee','SG',585,20,3],['Cashew','RN',780,25,6],['Cashew','MS',745,100,9],['Khoa','KD',320,30,1],['Cardamom','MS',2600,5,4],['Cardamom','RN',2750,2,7],['Pista','RN',1450,10,7],['Gift box','PW',12,1000,5],['Gift box','KP',12.8,500,3],['Khoa','TD',335,10,1],['Pista','NN',1380,20,10],['Cashew','NN',760,50,8]];
const STD={Besan:80,Sugar:43,Ghee:560,Cashew:770,Khoa:320,Cardamom:2650,Pista:1450,'Gift box':12};
const L=[['L-1042','Cashew',64,'Cold Rm A','2027-01-18','Released'],['L-1043','Besan',410,'Dry Rack 3','2027-03-02','Released'],['L-1044','Ghee',38,'Cold Rm B','2026-11-20','Released'],['L-1045','Sugar',900,'Dry Rack 1','2027-08-01','Released'],['L-1046','Khoa',22,'Cold Rm B','2026-11-02','Quarantine'],['L-1047','Cardamom',3,'Spice Cage','2027-05-10','Released'],['L-1048','Pista',18,'Cold Rm A','2026-12-30','Released'],['L-1049','Gift box',2600,'Pack Hall','2028-01-01','Released'],['L-1050','Cashew',140,'Cold Rm A','2027-02-14','Released'],['L-1051','Sugar',350,'Dry Rack 1','2027-09-10','Released'],['L-1052','Ghee',22,'Cold Rm B','2026-12-05','Released'],['L-1053','Besan',180,'Dry Rack 3','2027-01-25','Released'],['L-1054','Khoa',45,'Cold Rm B','2026-11-12','Released'],['L-1055','Pista',6,'Cold Rm A','2026-11-18','Released'],['L-1056','Cardamom',8,'Spice Cage','2027-06-30','Released']].map(a=>({id:a[0],item:a[1],q:a[2],loc:a[3],exp:a[4],st:a[5]}));
const RE={Cashew:60,Besan:300,Ghee:40,Sugar:400,Khoa:30,Cardamom:5,Pista:15,'Gift box':1500};
const REC=[{n:'Kaju Katli',v:'v3',bom:{Cashew:.55,Sugar:.4,Ghee:.03},y:1},{n:'Mysore Pak',v:'v2',bom:{Besan:.35,Ghee:.55,Sugar:.5},y:1.4},{n:'Besan Ladoo',v:'v4',bom:{Besan:.5,Ghee:.25,Sugar:.3,Cardamom:.004},y:1.05},{n:'Soan Papdi',v:'v2',bom:{Besan:.3,Sugar:.5,Ghee:.3,Cardamom:.003},y:1},{n:'Motichoor Ladoo',v:'v5',bom:{Besan:.45,Sugar:.5,Ghee:.2},y:1.1}];
const BT=[['B-7731',0,100,60,0.9],['B-7732',1,100,70,3.2],['B-7733',2,100,64,1.0],['B-7734',3,100,59,1.2],['B-7735',4,100,66,.8],['B-7736',0,200,121,1.6],['B-7737',1,150,128,2.4],['B-7738',2,120,70,4.1]];
const OUT=[['Coimbatore RS Puram','Franchise',180000],['Chennai T Nagar','Company',264000],['Madurai Anna Nagar','Franchise',142000],['Salem Fairlands','Company',98000],['Trichy Srirangam','Franchise',156000],['Erode Perundurai','Franchise',87000]];
const SH=[['S-5521','Coimbatore RS Puram',120,120],['S-5522','Chennai T Nagar',200,196],['S-5523','Madurai Anna Nagar',90,81],['S-5524','Salem Fairlands',60,60],['S-5525','Coimbatore RS Puram',80,80],['S-5526','Trichy Srirangam',110,108],['S-5527','Erode Perundurai',70,70],['S-5528','Chennai T Nagar',150,150],['S-5529','Coimbatore RS Puram',60,57]];
let EX=[['E-101','Receipt variance','S-5523: 9 boxes short',4050,'High','Logistics lead',2],['E-102','Price deviation','Cashew PO 6% above approved rate',1900,'Medium','Procurement',1],['E-103','Yield variance','B-7732 Mysore Pak under standard',2600,'High','Factory mgr',1],['E-104','Near expiry','Khoa lot L-1046 in quarantine, 6 days left',7040,'High','Quality',0],['E-105','Receipt variance','S-5529: 3 boxes short at RS Puram',1350,'Low','Logistics lead',0],['E-106','Yield variance','B-7738 Besan Ladoo 7% under standard',3100,'High','Factory mgr',0],['E-107','Near expiry','Pista lot L-1055 has 22 days left, 6 kg',8700,'Medium','Warehouse',3],['E-108','Vendor','Madurai Spice House rejection rate above 3%',0,'Medium','Procurement',5]].map(a=>({id:a[0],t:a[1],d:a[2],imp:a[3],sev:a[4],own:a[5],age:a[6],st:'Open'}));
const TR={'L-1042':['Cashew lot L-1042','Royal Nut Traders, GRN 08 Oct','Passed incoming QC','Batch B-7731 Kaju Katli','Shipment S-5521','Coimbatore RS Puram (Franchise)'],'L-1043':['Besan lot L-1043','Sri Ganesh Agro, GRN 11 Oct','Passed incoming QC','Batch B-7733 Besan Ladoo','Shipment S-5522','Chennai T Nagar (Company)'],'L-1044':['Ghee lot L-1044','Kovai Dairy Co-op, GRN 15 Oct','Passed incoming QC','Batch B-7732 Mysore Pak','Shipment S-5523','Madurai Anna Nagar (Franchise)'],'L-1045':['Sugar lot L-1045','Sakthi Sugars, GRN 03 Oct','Passed incoming QC','Batch B-7736 Kaju Katli','Shipment S-5528','Chennai T Nagar (Company)'],'L-1050':['Cashew lot L-1050','Royal Nut Traders, GRN 18 Oct','Passed incoming QC','Batch B-7736 Kaju Katli','Shipment S-5526','Trichy Srirangam (Franchise)']};
let S={view:'Command Center',po:[{id:'PO-2000',item:'Sugar',v:'SS',q:600,val:24600,eta:'30/10/2026',st:'Approved'},{id:'PO-1999',item:'Cashew',v:'RN',q:100,val:78000,eta:'02/11/2026',st:'Pending approval'},{id:'PO-1998',item:'Ghee',v:'KD',q:120,val:67200,eta:'24/10/2026',st:'Received'},{id:'PO-1997',item:'Besan',v:'SG',q:300,val:24600,eta:'21/10/2026',st:'Received'},{id:'PO-1996',item:'Gift box',v:'PW',q:3000,val:36000,eta:'01/11/2026',st:'Approved'},{id:'PO-1995',item:'Pista',v:'RN',q:20,val:29000,eta:'03/11/2026',st:'Approved'}],audit:[{t:'09:42:10',u:'Owner',a:'PO Approved',d:'PO-2000'},{t:'09:15:33',u:'Quality',a:'Lot released',d:'L-1048'},{t:'08:58:02',u:'Procurement',a:'PO raised',d:'PO-1999 100 kg Cashew at ₹780'},{t:'08:30:47',u:'Owner',a:'Exception closed',d:'E-099: courier delay confirmed, no loss'},{t:'08:12:19',u:'Procurement',a:'Stock adjusted',d:'L-1044 -2 kg, reason: spillage'}],f:'All',sel:{item:'Cashew',qty:100},poSeq:2001};
const log=(a,d)=>S.audit.unshift({t:new Date().toLocaleTimeString(),u:$('#role').value,a,d});
const toast=m=>{const e=$('#toast');e.textContent=m;e.className='s';setTimeout(()=>e.className='',2400)};
const role=()=>$('#role').value,fr=()=>role().startsWith('Franchise');
const tabs=()=>fr()?['Command Center','Distribution']:['Command Center','Procurement','Inventory','Production','Distribution','Traceability','Exceptions & Audit'];
const best=(item,q)=>{const o=O.filter(x=>x[0]==item).map(x=>{const v=V[x[1]];const ok=q>=x[3];const sc=(v.otd-v.rej*3)/100*40+(1-x[2]/Math.max(...O.filter(y=>y[0]==item).map(y=>y[2])))*300+(10-x[4])*2;return{v:x[1],p:x[2],moq:x[3],lead:x[4],ok,tot:Math.max(q,x[3])*x[2],sc}});o.sort((a,b)=>(b.ok-a.ok)||b.sc-a.sc);return o};
const stockVal=()=>L.reduce((s,l)=>s+l.q*STD[l.item],0);
const views={
'Command Center'(){const k=S.f=='All'?1:.35,sales=OUT.filter(o=>!fr()||o[0].startsWith('Coimbatore')).filter(o=>S.f=='All'||o[0].startsWith(S.f));
const mx=Math.max(...sales.map(s=>s[2]));const open=EX.filter(e=>e.st=='Open');
const bl=BT.map(b=>b[2]-b[3]*0);return `<h2>Command center</h2><div class="row"><label class="lbl">Region <select onchange="S.f=this.value;go()">${['All','Coimbatore','Chennai','Madurai','Salem'].map(r=>`<option ${r==S.f?'selected':''}>${r}</option>`)}</select></label><span class="lbl">Report generated ${new Date().toLocaleString()}</span></div>
<div class="grid">${fr()?`<div class="card"><div class="lbl">Outlet sales, 7 days</div><div class="big">${R(sales.reduce((s,x)=>s+x[2],0))}</div></div><div class="card"><div class="lbl">Order fill rate</div><div class="big">100%</div></div>`:`
<div class="card"><div class="lbl">Sales, 7 days</div><div class="big">${R(sales.reduce((s,x)=>s+x[2],0))}</div><div class="up">+8.4% vs last week</div></div>
<div class="card"><div class="lbl">Stock value on hand</div><div class="big">${R(stockVal())}</div></div>
<div class="card"><div class="lbl">Open purchase orders</div><div class="big">${S.po.filter(p=>p.st!='Received').length}</div></div>
<div class="card"><div class="lbl">OTIF delivery</div><div class="big">${Math.round(SH.filter(s=>s[2]==s[3]).length/SH.length*100)}%</div></div>
<div class="card"><div class="lbl">Open exceptions</div><div class="big ${open.length?'dn':''}">${open.length}</div><div class="lbl">${R(open.reduce((s,e)=>s+e.imp,0))} at risk</div></div>`}</div>
<div class="card" style="margin-top:14px"><h3>Sales by outlet (click bar to drill down)</h3><div class="bars" style="margin:16px 0 30px">${sales.map(s=>`<div style="height:${s[2]/mx*100}%" onclick="toast('${s[0]}: ${R(s[2])} from 1,284 bills. Trace to POS transactions.')"><span>${s[0].split(' ')[0]}</span></div>`).join('')}</div></div>`},
Procurement(){const q=+S.sel.qty||1,o=best(S.sel.item,q);return `<h2>Procurement and vendor intelligence</h2><div class="card"><h3>Quote comparison and PO builder</h3><div class="row"><select onchange="S.sel.item=this.value;go()">${Object.keys(U).map(i=>`<option ${i==S.sel.item?'selected':''}>${i}</option>`)}</select><input type="number" min="1" value="${q}" onchange="S.sel.qty=this.value;go()" style="width:110px"> <span class="lbl">${U[S.sel.item]} required</span></div>
<div class="wrap"><table><tr><th>Vendor</th><th>Price / ${U[S.sel.item]}</th><th>MOQ</th><th>Lead time</th><th>Delivery by</th><th>Order value</th><th>On-time</th><th>Rejection</th><th></th></tr>${o.map((x,i)=>{const d=new Date(Date.now()+x.lead*864e5).toLocaleDateString('en-GB',{day:'2-digit',month:'short'});return `<tr class="${i==0&&x.ok?'best':''}"><td>${V[x.v].n} ${i==0&&x.ok?'<span class="tag ok">Recommended</span>':''}</td><td>${R(x.p)}${x.p>STD[S.sel.item]*1.05?' <span class="tag crit">+'+Math.round((x.p/STD[S.sel.item]-1)*100)+'% vs approved</span>':''}</td><td>${x.moq} ${U[S.sel.item]}</td><td>${x.lead} days</td><td>${d}</td><td>${R(x.tot)}</td><td>${V[x.v].otd}%</td><td>${V[x.v].rej}%</td><td>${x.ok?`<button class="pri" onclick="mkPO('${x.v}')">Raise PO</button>`:`<span class="tag warn">Below MOQ by ${x.moq-q}</span> <button onclick="mkPO('${x.v}',1)">Order MOQ</button>`}</td></tr>`}).join('')}</table></div></div>
<div class="card" style="margin-top:14px"><h3>Purchase orders</h3><div class="wrap"><table><tr><th>PO</th><th>Item</th><th>Vendor</th><th>Qty</th><th>Value</th><th>ETA</th><th>Status</th><th></th></tr>${S.po.map(p=>`<tr><td>${p.id}</td><td>${p.item}</td><td>${V[p.v].n}</td><td>${p.q} ${U[p.item]}</td><td>${R(p.val)}</td><td>${p.eta}</td><td><span class="tag ${p.st=='Received'?'ok':p.st=='Pending approval'?'warn':''}">${p.st}</span></td><td>${p.st=='Pending approval'?`<button class="pri" onclick="adv(${p.id.slice(3)},'Approved')">Approve</button>`:p.st=='Approved'?`<button onclick="adv(${p.id.slice(3)},'Received')">Receive goods</button>`:''}</td></tr>`).join('')||'<tr><td colspan=8 class="lbl">No purchase orders yet. Pick an item and raise one above.</td></tr>'}</table></div><p class="lbl">POs over ₹50,000 need Owner approval (maker-checker). Receiving posts a new lot to Quarantine until Quality releases it.</p></div>
<div class="card" style="margin-top:14px"><h3>Vendor scorecards</h3><div class="wrap"><table><tr><th>Vendor</th><th>On-time</th><th>Rejection</th><th>Avg lead</th><th>Risk</th></tr>${Object.keys(V).map(k=>{const ls=O.filter(o=>o[1]==k);const a=ls.reduce((s,o)=>s+o[4],0)/ls.length;const sole=ls.some(l=>O.filter(o=>o[0]==l[0]).length==1);return `<tr><td>${V[k].n}</td><td>${V[k].otd}%</td><td>${V[k].rej}%</td><td>${a.toFixed(1)} days</td><td>${V[k].rej>3?'<span class="tag crit">Repeated rejections</span>':sole?'<span class="tag warn">Sole source</span>':'<span class="tag ok">Healthy</span>'}</td></tr>`}).join('')}</table></div></div>`},
Inventory(){const s=[...L].sort((a,b)=>a.exp.localeCompare(b.exp));return `<h2>Inventory and warehouse</h2><div class="card wrap"><table><tr><th>Lot</th><th>Item</th><th>Qty</th><th>Location</th><th>Best before</th><th>Status</th><th>Alerts</th><th></th></tr>${s.map(l=>{const dl=Math.round((new Date(l.exp)-Date.now())/864e5);return `<tr><td>${l.id}</td><td>${l.item}</td><td>${l.q} ${U[l.item]}</td><td>${l.loc}</td><td>${l.exp} (${dl}d)</td><td><span class="tag ${l.st=='Released'?'ok':'warn'}">${l.st}</span></td><td>${l.q<RE[l.item]?'<span class="tag crit">Below reorder</span> ':''}${dl<30?'<span class="tag warn">Near expiry</span>':''}</td><td>${l.st=='Quarantine'?(role()=='Quality'||role()=='Owner'?`<button class="pri" onclick="rel('${l.id}')">Release</button>`:'<span class="lbl">Quality only</span>'):`<button onclick="adj('${l.id}')">Adjust</button>`}</td></tr>`}).join('')}</table></div><p class="lbl">Sorted FEFO: earliest expiry is picked first. Adjustments need a reason code and are logged.</p>`},
Production(){return `<h2>Recipes and production</h2><div class="grid">${REC.map(r=>{const c=Object.entries(r.bom).reduce((s,[i,q])=>s+q*STD[i],0)/r.y;return `<div class="card"><h3>${r.n} <span class="tag">${r.v} approved</span></h3><p class="lbl">Per kg of output: ${Object.entries(r.bom).map(([i,q])=>`${(q/r.y).toFixed(3)} kg ${i}`).join(', ')}</p><div class="big">${R(c)}</div><div class="lbl">standard ingredient cost per kg</div></div>`}).join('')}</div>
<div class="card wrap" style="margin-top:14px"><h3>Batch records: standard vs actual</h3><table><tr><th>Batch</th><th>Recipe</th><th>Input</th><th>Expected</th><th>Output</th><th>Rejects</th><th>Yield variance</th><th>Cost / kg</th></tr>${BT.map(b=>{const r=REC[b[1]],exp=b[2]*r.y*.01*10,out=b[3]*1;const e=b[2]*r.y*.6;const o=b[3],v=(o-e)/e*100;return `<tr><td>${b[0]}</td><td>${r.n} ${r.v}</td><td>${b[2]} kg</td><td>${e.toFixed(0)} kg</td><td>${o} kg</td><td>${b[4]} kg</td><td class="${Math.abs(v)>5?'dn':'up'}">${v.toFixed(1)}%</td><td>${R(Object.entries(r.bom).reduce((s,[i,q])=>s+q*STD[i],0)/r.y*1.08)}</td></tr>`}).join('')}</table><p class="lbl">Variance beyond ±5% opens an exception. Release of finished batches is restricted to Quality.</p></div>`},
Distribution(){const sh=SH.filter(s=>!fr()||s[1].startsWith('Coimbatore'));return `<h2>Distribution and franchise</h2><div class="card wrap"><table><tr><th>Shipment</th><th>Outlet</th><th>Dispatched</th><th>Received</th><th>Variance</th><th></th></tr>${sh.map(s=>{const d=s[3]-s[2];return `<tr><td>${s[0]}</td><td>${s[1]}</td><td>${s[2]} boxes</td><td>${s[3]} boxes</td><td>${d?`<span class="tag crit">${d} boxes</span>`:'<span class="tag ok">Matched</span>'}</td><td>${d?'<span class="lbl">Exception E-101 opened</span>':''}</td></tr>`}).join('')}</table></div>
<div class="card wrap" style="margin-top:14px"><h3>Outlets and commercial terms</h3><table><tr><th>Outlet</th><th>Model</th><th>7-day sales</th><th>Pricing</th><th>Credit limit</th><th>Royalty</th></tr>${OUT.filter(o=>!fr()||o[0].startsWith('Coimbatore')).map(o=>`<tr><td>${o[0]}</td><td>${o[1]}</td><td>${R(o[2])}</td><td>${o[1]=='Franchise'?'Franchise tier B':'Retail MRP'}</td><td>${o[1]=='Franchise'?R(150000):'n/a'}</td><td>${o[1]=='Franchise'?'5% of sales':'n/a'}</td></tr>`).join('')}</table></div>`},
Traceability(){const k=S.tr||'L-1042';return `<h2>Lot traceability</h2><div class="row"><select onchange="S.tr=this.value;go()">${Object.keys(TR).map(x=>`<option ${x==k?'selected':''}>${x}</option>`)}</select><span class="lbl">Forward trace from supplier lot to destination outlet</span></div><div class="card"><div class="chain">${TR[k].map((n,i)=>`${i?'<span class="up">➜</span>':''}<div class="n">${n}</div>`).join('')}</div></div><p class="lbl">Complete chain in seconds: receipt, inspection, storage, production usage, finished batch, dispatch and outlet receipt.</p>`},
'Exceptions & Audit'(){return `<h2>Exceptions and audit trail</h2><div class="card wrap"><table><tr><th>Case</th><th>Type</th><th>Detail</th><th>Impact</th><th>Severity</th><th>Owner</th><th>Age</th><th></th></tr>${EX.map(e=>`<tr><td>${e.id}</td><td>${e.t}</td><td>${e.d}</td><td>${R(e.imp)}</td><td><span class="tag ${e.sev=='High'?'crit':'warn'}">${e.sev}</span></td><td>${e.own}</td><td>${e.age}d</td><td>${e.st=='Open'?`<button onclick="resolve('${e.id}')">Resolve</button>`:'<span class="tag ok">Closed</span>'}</td></tr>`).join('')}</table><p class="lbl">Anomalies are signals to investigate, not proof of wrongdoing. Closing needs a finding and a different approver.</p></div>
<div class="card wrap" style="margin-top:14px"><h3>Audit log</h3><table><tr><th>Time</th><th>User</th><th>Action</th><th>Detail</th></tr>${S.audit.map(a=>`<tr><td>${a.t}</td><td>${a.u}</td><td>${a.a}</td><td>${a.d}</td></tr>`).join('')||'<tr><td colspan=4 class="lbl">No actions yet. Every PO, approval, adjustment and release lands here.</td></tr>'}</table></div>`}};
function mkPO(v,m){if(fr())return;const o=best(S.sel.item,+S.sel.qty).find(x=>x.v==v);const q=m?o.moq:+S.sel.qty;const val=q*o.p,id='PO-'+(S.poSeq++);
S.po.unshift({id,item:S.sel.item,v,q,val,eta:new Date(Date.now()+o.lead*864e5).toLocaleDateString('en-GB'),st:val>50000?'Pending approval':'Approved'});log('PO raised',id+' '+q+' '+U[S.sel.item]+' '+S.sel.item+' at '+R(o.p));
if(o.p>STD[S.sel.item]*1.05){EX.unshift({id:'E-'+(110+S.poSeq),t:'Price deviation',d:id+' priced '+Math.round((o.p/STD[S.sel.item]-1)*100)+'% above approved',imp:Math.round((o.p-STD[S.sel.item])*q),sev:'Medium',own:'Procurement',age:0,st:'Open'})}
toast(id+(val>50000?' sent for Owner approval':' approved'));go()}
function adv(n,st){const p=S.po.find(x=>x.id=='PO-'+n);if(st=='Approved'&&role()!='Owner')return toast('Only the Owner can approve this PO');p.st=st;log('PO '+st,p.id);
if(st=='Received'){L.push({id:'L-'+(1100+L.length),item:p.item,q:p.q,loc:'Receiving Bay',exp:'2027-04-01',st:'Quarantine'});log('Stock posted',p.q+' '+p.item+' to quarantine')}go()}
function rel(id){L.find(l=>l.id==id).st='Released';log('Lot released',id);toast(id+' released');go()}
function adj(id){const l=L.find(x=>x.id==id),r=prompt('Reason code for adjusting '+id+' (damage, spillage, count correction)?');if(!r)return;const d=+prompt('Quantity change (negative to reduce)?','-1');if(!d)return;if(Math.abs(d*STD[l.item])>5000&&role()!='Owner')return toast('Over ₹5,000: needs Owner approval');l.q+=d;log('Stock adjusted',id+' '+d+' '+U[l.item]+', reason: '+r);go()}
function resolve(id){const f=prompt('Finding for '+id+'?');if(!f)return;EX.find(e=>e.id==id).st='Closed';log('Exception closed',id+': '+f);go()}
function go(){const t=tabs();if(!t.includes(S.view))S.view=t[0];$('#nav').innerHTML=t.map(x=>`<button class="${x==S.view?'on':''}" onclick="S.view='${x.replace(/'/g,'')}';go()">${x}</button>`).join('');$('#app').innerHTML=views[S.view]()}
$('#role').onchange=go;go();
</script></body></html>
